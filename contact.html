<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - EduLearn Academy</title>
    <link rel="icon" type="image/png" href="assets/img/LogoELA_favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .map-iframe {
            border: 0;
            border-radius: 8px;
        }
        .map-container iframe {
            border: 0;
            border-radius: 8px;
        }
    </style>
</head>
<body class="font-poppins bg-slate-900 text-white">

    <div id="loading-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-slate-900">
        <img src="assets/img/LogoELA_favicon.png" alt="EduLearn Academy" class="w-24 h-24 animate-bounce mb-4">
        <div class="spinner-border text-cyan-400" role="status"></div>
        <p class="mt-3 text-cyan-400 font-medium">Memuat EduLearn Academy...</p>
    </div>

    <header class="sticky top-0 z-50">
        <nav id="main-navbar" class="navbar navbar-expand-lg navbar-dark py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="assets/img/LogoELA_favicon.png" alt="Logo" width="35" height="35" class="me-2">
                    <span class="fw-bold text-white text-xl">EduLearn <span class="text-cyan-400">Academy</span></span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation" title="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center gap-lg-2">
                        <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="learning-center.html">Learning Center</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="cyber-lab.html">Cyber Lab</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="quiz-center.html">Quiz Center</a></li>
                        <li class="nav-item"><a class="nav-link text-white active" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container">
            <div class="text-center mb-5 pt-5" data-aos="fade-down">
                <h1 class="display-4 fw-bold text-white">Contact <span class="text-cyan-400">Us</span></h1>
                <p class="lead text-slate-400">Ada pertanyaan? Kirimkan pesan kepada tim kami.</p>
            </div>

            <div class="row g-4">
                <!-- Form Contact (Integrasi Supabase) -->
                <div class="col-md-6" data-aos="fade-right">
                    <form id="contactForm" class="card-custom p-4 rounded-lg">
                        <div class="mb-3">
                            <label for="name" class="form-label text-slate-300 small">Nama Lengkap</label>
                            <input type="text" id="name" name="name" placeholder="Masukkan nama lengkap" class="form-control bg-slate-800 border-slate-700 text-white" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label text-slate-300 small">Email</label>
                            <input type="email" id="email" name="email" placeholder="Masukkan email" class="form-control bg-slate-800 border-slate-700 text-white" required>
                        </div>
                        <div class="mb-3">
                            <label for="subject" class="form-label text-slate-300 small">Subjek</label>
                            <select id="subject" name="subject" class="form-select bg-slate-800 border-slate-700 text-white">
                                <option>Pertanyaan Materi</option>
                                <option>Laporan Bug Website</option>
                                <option>Kerjasama</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label text-slate-300 small">Pesan</label>
                            <textarea id="message" name="message" rows="4" placeholder="Tulis pesan Anda di sini..." class="form-control bg-slate-800 border-slate-700 text-white" required></textarea>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                            <label class="form-check-label text-slate-400 small" for="agreeTerms">Saya setuju data ini disimpan untuk keperluan komunikasi.</label>
                        </div>
                        <button type="submit" class="btn btn-cyan-400 text-slate-900 fw-bold w-100">Kirim Pesan</button>
                        <div id="formMessage" class="mt-3 text-center small"></div>
                    </form>
                </div>

                <!-- Iframe Google Maps (UAS Checklist) -->
                <div class="col-md-6" data-aos="fade-left">
                    <div class="card-custom p-4 rounded-lg h-100">
                        <h4 class="fw-bold text-cyan-400 mb-3">Lokasi Kami</h4>
                        <p class="text-slate-400 small">Universitas Siber Asia (UNSIA), Jakarta.</p>
                        <iframe class="map-iframe" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.402088458794!2d106.8254433147688!3d-6.175392995514302!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e69f5d2e764b12d%3A0x3d2ad6e1e0e9bcc8!2sUniversitas%20Siber%20Asia!5e0!3m2!1sid!2sid!4v1678888888888" width="100%" height="350" title="Peta lokasi Universitas Siber Asia" allowfullscreen loading="lazy"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-950 text-slate-400 pt-5 pb-4 border-t border-slate-800">
        <div class="container">
            <div class="text-center small">
                <p>Copyright &copy; <span id="current-year"></span> EduLearn Academy. Powered by Universitas Siber Asia.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script src="assets/js/main.js"></script>
    
    <!-- Script Integrasi Supabase (Type="module" karena pakai ES6 Import) -->
    <script type="module">
        import { supabase } from './assets/js/supabaseClient.js';

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            const formMessage = document.getElementById('formMessage');

            // Simulasi pengiriman data (Uncomment baris di bawah jika Supabase sudah disetup)
            /*
            const { data, error } = await supabase
                .from('contact_messages')
                .insert([{ name, email, subject, message }]);

            if (error) {
                formMessage.innerHTML = "<span class='text-red-400'>Gagal mengirim pesan.</span>";
            } else {
                formMessage.innerHTML = "<span class='text-green-400'>Pesan berhasil terkirim! Terima kasih.</span>";
                document.getElementById('contactForm').reset();
            }
            */
            
            // Demo alert (Hapus jika Supabase aktif)
            formMessage.innerHTML = "<span class='text-cyan-400'>Pesan berhasil disimulasikan! (Aktifkan Supabase untuk nyata)</span>";
            document.getElementById('contactForm').reset();
        });
    </script>
</body>
</html>
